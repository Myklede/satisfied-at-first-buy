<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!--
      Studio (prompts/31): Decart photoreal view + our Fit Lab. CSP (security review M1): connections
      only to this origin (Vite 5810, which also proxies the body/fit API as /api), the loopback token
      server (5830), Vite HMR (ws 5810) and the Decart hosts from
      https://docs.platform.decart.ai/integrations/network-requirements; no SDK telemetry host. No
      inline script; WASM (MediaPipe, cloth solver) and blob workers only.
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' blob: data:; media-src 'self' blob: mediastream:; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'none'; connect-src 'self' http://127.0.0.1:5830 http://localhost:5830 ws://127.0.0.1:5810 ws://localhost:5810 https://api.decart.ai wss://api.decart.ai https://lk.decart.ai wss://lk.decart.ai https://*.lkc.decart.ai wss://*.lkc.decart.ai blob: data:"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Satisfy Studio</title>
    <link rel="icon" href="data:," />
    <style>
      :root {
        color-scheme: light;
        --bg: #f5f3ef;
        --bg-deep: #ece9e3;
        --card: #ffffff;
        --line: rgba(29, 29, 31, 0.1);
        --text: #1d1d1f;
        --soft: #6e6e73;
        --accent: #2f4a3f;
        --shadow: 0 1px 2px rgba(29, 29, 31, 0.06), 0 6px 20px rgba(29, 29, 31, 0.07);
        font:
          14px/1.45 -apple-system,
          BlinkMacSystemFont,
          'Segoe UI',
          Roboto,
          'Helvetica Neue',
          Arial,
          sans-serif;
        -webkit-font-smoothing: antialiased;
      }
      html,
      body,
      #studio {
        height: 100%;
        margin: 0;
        background: var(--bg);
        color: var(--text);
      }
      #studio {
        display: grid;
        grid-template-rows: 1fr auto;
      }
      .studio {
        display: grid;
        grid-template-columns: minmax(0, 2fr) minmax(0, 1fr);
        gap: 16px;
        padding: 16px;
        min-height: 0;
      }
      .big {
        position: relative;
        background: #111;
        border-radius: 16px;
        box-shadow: var(--shadow);
        min-height: 0;
        overflow: hidden;
      }
      .big-slot,
      .overlay-host {
        position: absolute;
        inset: 0;
      }
      .big.mirror .big-slot,
      .big.mirror .overlay-host {
        transform: scaleX(-1);
      }
      .big-slot video {
        width: 100%;
        height: 100%;
        object-fit: contain;
      }
      .overlay-host {
        pointer-events: none;
      }
      .big-caption,
      .big-note {
        position: absolute;
        left: 12px;
        padding: 3px 10px;
        background: rgba(255, 255, 255, 0.82);
        color: var(--soft);
        backdrop-filter: blur(8px);
        border-radius: 999px;
        font-size: 12px;
      }
      .big-caption {
        top: 12px;
      }
      .big-note {
        bottom: 12px;
      }
      .big-note:empty {
        display: none;
      }
      .side {
        display: grid;
        grid-template-rows: 1fr 96px;
        gap: 12px;
        min-height: 0;
      }
      .fit-host {
        position: relative;
        background: var(--bg-deep);
        border-radius: 16px;
        box-shadow: var(--shadow);
        min-height: 0;
        overflow: hidden;
      }
      .placeholder {
        padding: 16px;
        color: var(--soft);
      }
      .log {
        overflow: auto;
        background: var(--card);
        border-radius: 12px;
        padding: 8px 10px;
        color: var(--soft);
        font:
          11px/1.4 ui-monospace,
          'SF Mono',
          Consolas,
          monospace;
      }
      .log .warn {
        color: #b97a12;
      }
      .log .error {
        color: #e5484d;
      }
      .log a {
        color: var(--accent);
      }
      .bar {
        display: flex;
        flex-wrap: wrap;
        gap: 16px;
        align-items: center;
        padding: 12px 20px;
        background: var(--card);
        border-top: 1px solid var(--line);
      }
      .group {
        display: flex;
        gap: 4px;
        align-items: center;
      }
      .bar button {
        font: inherit;
        font-weight: 500;
        padding: 8px 16px;
        background: rgba(29, 29, 31, 0.06);
        color: var(--text);
        border: 0;
        border-radius: 999px;
        cursor: pointer;
        transition: background 0.15s ease;
      }
      .bar button:hover {
        background: rgba(29, 29, 31, 0.1);
      }
      .bar button.on {
        background: var(--text);
        color: #fff;
      }
      .bar button.decart {
        background: var(--accent);
        color: #fff;
        font-weight: 600;
      }
      .bar button.decart.live,
      .bar button.rec.on {
        background: #e5484d;
        color: #fff;
      }
      .zip {
        color: var(--soft);
      }
      .zip input {
        width: 180px;
        accent-color: var(--accent);
      }
      .zip-label,
      .decart-text,
      .money {
        font-size: 12px;
        color: var(--soft);
        font-variant-numeric: tabular-nums;
      }
      .credits {
        font-size: 14px;
        font-weight: 600;
        color: var(--text);
        font-variant-numeric: tabular-nums;
      }
      /* ---- jacket cards: chooser over the big view before a pick, rail in the bar after ---- */
      .chooser {
        position: absolute;
        inset: 0;
        display: grid;
        place-items: center;
        background: rgba(17, 17, 17, 0.55);
        backdrop-filter: blur(6px);
        z-index: 2;
      }
      .group[hidden],
      .chooser[hidden] {
        display: none;
      }
      .chooser-inner {
        background: var(--bg);
        border-radius: 20px;
        box-shadow: var(--shadow);
        padding: 24px 28px 28px;
        text-align: center;
        max-width: calc(100% - 48px);
      }
      .chooser-title {
        margin: 0 0 4px;
        font-size: 22px;
        font-weight: 600;
        letter-spacing: -0.01em;
      }
      .chooser-sub {
        margin: 0 0 18px;
        color: var(--soft);
      }
      .jcards-large {
        display: flex;
        gap: 20px;
        justify-content: center;
        flex-wrap: wrap;
      }
      .jcards-rail {
        display: flex;
        gap: 8px;
      }
      .jcard {
        font: inherit;
        color: var(--text);
        text-align: left;
        background: var(--card);
        border: 1.5px solid var(--line);
        border-radius: 14px;
        cursor: pointer;
        padding: 0;
        overflow: hidden;
        transition:
          border-color 0.15s ease,
          box-shadow 0.15s ease;
      }
      .jcard:hover {
        border-color: rgba(29, 29, 31, 0.3);
      }
      .jcard:focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: 2px;
      }
      .jcard.on {
        border-color: var(--accent);
        box-shadow: 0 0 0 2px var(--accent);
      }
      .jcard-pic {
        background: var(--bg-deep);
      }
      .jcard-pic img {
        display: block;
        width: 100%;
        height: 100%;
        object-fit: cover;
      }
      .jcard.no-img .jcard-pic {
        display: none;
      }
      .jcard-large {
        width: 280px;
        display: flex;
        flex-direction: column;
      }
      .jcard-large .jcard-pic {
        height: 280px;
      }
      .jcard-large .jcard-text {
        padding: 12px 14px 14px;
      }
      .jcard-large .jcard-name {
        font-weight: 600;
        line-height: 1.3;
      }
      .jcard-large .jcard-meta {
        margin-top: 4px;
        font-size: 12px;
        color: var(--soft);
      }
      .jcard-large.no-img {
        min-height: 120px;
        justify-content: center;
      }
      .bar button.jcard-thumb {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 3px 12px 3px 3px;
        border-radius: 12px;
        background: var(--card);
      }
      .bar button.jcard-thumb.on {
        background: var(--card);
        color: var(--text);
      }
      .bar button.jcard-thumb.no-img {
        padding-left: 12px;
      }
      .jcard-thumb .jcard-pic {
        width: 44px;
        height: 44px;
        border-radius: 9px;
        overflow: hidden;
      }
      .jcard-thumb .jcard-name {
        font-weight: 600;
        line-height: 1.2;
      }
      .jcard-thumb .jcard-meta {
        font-size: 11px;
        color: var(--soft);
      }
      .bar button.decart-stop.live {
        background: #e5484d;
        color: #fff;
      }
      .bar button.decart:disabled,
      .bar button.decart-stop:disabled {
        opacity: 0.4;
        cursor: default;
      }
    </style>
  </head>
  <body>
    <div id="studio"></div>
    <script type="module" src="/src/studio/main.ts"></script>
  </body>
</html>
