[project]
name = "satisfy-body"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
  "anny==0.6.2",
  "torch==2.15.0+cpu",
  "fastapi==0.162.4",
  "uvicorn==0.54.0",
  "pydantic==2.14.3",
  "trimesh==5.2.0",
  "numpy==2.5.4",
  "pillow==13.0.0",
  "scipy==1.18.1",
  "rtree==1.4.1",
]

[dependency-groups]
dev = [
    "pytest==9.2.0",
    "ruff==0.17.4",
    "httpx==0.28.1",
    "jsonschema==4.26.0",
    "matplotlib==3.11.2",
    "pypdf==7.0.1",
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[tool.pytest.ini_options]
pythonpath = ["services/body"]
testpaths = ["services/body/tests"]
markers = ["slow: real Anny model integration and accuracy"]
cache_dir = ".cache/pytest"

[tool.ruff]
target-version = "py312"
cache-dir = ".cache/ruff"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
